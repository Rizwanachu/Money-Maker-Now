kind = "web"
previewPath = "/"
title = "ProposAI"
version = "1.0.0"
id = "artifacts/proposai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25425

[services.development]
run = "pnpm --filter @workspace/proposai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/proposai", "run", "build" ]
publicDir = "artifacts/proposai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25425"
BASE_PATH = "/"
